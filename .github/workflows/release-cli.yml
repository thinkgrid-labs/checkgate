name: Release CLI

# Triggered by version tags: v1.2.3 (shared convention with the SDK releases).
on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    name: Publish @checkgate/cli to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The CLI has zero runtime dependencies — no install step needed.
      - name: Run tests
        working-directory: cli
        run: node --test

      # End-to-end sanity: generate all three languages from the fixture so a
      # broken generator can never ship.
      - name: Smoke-test codegen
        working-directory: cli
        run: node bin/checkgate.js typegen --lang ts,dart,rust --input test/fixtures/flags.json --out-dir /tmp/checkgate-gen

      - name: Set version from tag
        working-directory: cli
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish @checkgate/cli
        working-directory: cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
